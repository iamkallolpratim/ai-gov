name: Feature request
description: Suggest a capability, jurisdiction, or policy
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals are welcome. The most useful ones explain the compliance problem being
        solved, not only the feature being asked for.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is this?
      options:
        - New jurisdiction
        - New or changed policy rule
        - API capability
        - Developer experience / tooling
        - Documentation
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        Describe the situation you are stuck in. Who needs this, and what can they not do
        today?
      placeholder: |
        We operate in Brazil, so our systems fall under the LGPD, but the console only
        detects EU/CA/CN/IN. Brazilian systems show up as GLOBAL-only and we track their
        obligations in a spreadsheet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your proposed behaviour. Sketching the API or rule shape helps.
    validations:
      required: true

  - type: textarea
    id: regulation
    attributes:
      label: Regulatory basis
      description: |
        **Required for jurisdiction and policy requests.** Which law, article or section?
        Link to the official text where possible, and note any exemptions or carve-outs
        that the rule must respect.
      placeholder: |
        LGPD (Lei nº 13.709/2018), Art. 20 — right to review of automated decisions.
        PL 2338/2023 is still in passage; scope it to LGPD for now.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including "we do it manually today", which is useful signal.
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement this?
      description: See CONTRIBUTING.md for how to add jurisdictions and policies.
      options:
        - "Yes, I would like to work on it"
        - "Yes, with some guidance"
        - "No, I am suggesting it for someone else to pick up"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this idea
          required: true
