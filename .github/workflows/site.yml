name: Site

# Builds the landing page + docs in site/ and deploys them to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional repository variables: GOATCOUNTER_CODE (analytics), DEMO_URL (live demo button).

on:
  push:
    branches: [production]
    paths:
      - "site/**"
      - "policies/**"
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "policies/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Export OpenAPI schema from the FastAPI app
        run: |
          pip install -r requirements.txt
          make site-openapi

      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        env:
          PUBLIC_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          PUBLIC_DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
